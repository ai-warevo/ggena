[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ggena"
version = "0.1.0"
description = "AI Generator Orchestrator framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "diffusers",
    "transformers",
    "accelerate",
    "bitsandbytes",
    "pillow",
    "fastapi",
    "uvicorn[standard]",
    "peft",
    "pydantic",
    "python-dotenv",
    "typing-extensions",
]

[project.scripts]
ggena-cli = "src.app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
