services:
  ai-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ggena-ai
    container_name: ggena_container
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/workspace
      - ./hf_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
    stdin_open: true
    tty: true
    working_dir: /workspace
