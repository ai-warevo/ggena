services:
  ai-app:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: ggena-ai-local
    container_name: ggena_container_local
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/workspace
      - ./hf_cache:/root/.cache/huggingface
      - ./civitai_cache:/workspace/civitai_cache
    env_file:
      - .env
    stdin_open: true
    tty: true
    working_dir: /workspace
    depends_on:
      - comfyui

  comfyui:
    image: yanwk/comfyui-boot:cu126-slim
    container_name: ggena_comfyui
    ports:
      - "8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./hf_cache:/root/.cache/huggingface
      - ./civitai_cache:/root/ComfyUI/models/checkpoints
      - ./outputs:/root/ComfyUI/output
      - ./comfyui_custom_nodes:/root/ComfyUI/custom_nodes
      - ./hf_cache/hub:/root/ComfyUI/models/diffusers
    stdin_open: true
    tty: true
