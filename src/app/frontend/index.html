<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGena — AI Generator Orchestrator</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="GGena is a powerful full-stack AI orchestrator framework leveraging SDXL and lightweight LLMs for optimized image generation.">
    <meta name="keywords" content="AI, orchestrator, stable diffusion, sdxl, ollama, txt2img, framework">
    <meta name="author" content="GGena Team">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook / Discord / Telegram Previews -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="GGena — AI Generator Orchestrator">
    <meta property="og:description" content="High-performance orchestrated AI generation environment with automated prompt expansion and hardware acceleration.">
    <meta property="og:image" content="/static/og-preview.png">
    <meta property="og:url" content="https://ggena.ai">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="GGena — AI Generator Orchestrator">
    <meta name="twitter:description" content="High-performance orchestrated AI generation environment.">
    <meta name="twitter:image" content="/static/og-preview.png">

    <!-- Assets & Fonts -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico">
</head>
<body>
    <div class="app-container">
        <!-- Left Panel: Settings -->
        <aside class="settings-panel" id="settings-panel">
            <h1>Generator</h1>
            
            <div class="status-badge" id="connection-status">
                <span class="dot"></span>
                <span class="text">Connecting...</span>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-mode="ez" title="Simplified mode: Expand a simple keyword or idea using the text AI model">EZ Mode</button>
                <button class="tab-btn" data-mode="advanced" title="Expert mode: Full manual control over raw positive and negative tags">Advanced</button>
            </div>

            <!-- EZ Mode Container -->
            <div id="ez-mode-container" class="mode-container">
                <div class="input-group">
                    <label for="prompt">Prompt (Intent)</label>
                    <textarea id="prompt" placeholder="Describe what you want to see in natural language...">random</textarea>
                </div>
            </div>

            <!-- Advanced Mode Container -->
            <div id="advanced-mode-container" class="mode-container" style="display: none;">
                <div class="input-group">
                    <label for="positive_prompt">Positive Tags</label>
                    <textarea id="positive_prompt" placeholder="e.g. 1girl, solo, masterpiece..."></textarea>
                </div>
                <div class="input-group">
                    <label for="negative_prompt">Negative Tags</label>
                    <textarea id="negative_prompt" placeholder="e.g. low quality, blurry..."></textarea>
                </div>
            </div>

            <div class="control-row">
                <div class="control-item" title="Sampling steps: Higher numbers increase image detail but take longer to compute. 30-35 is optimal">
                    <label for="steps">Steps (<span id="steps-val">30</span>)</label>
                    <input type="range" id="steps" min="10" max="50" value="30">
                </div>
                <div class="control-item" title="Classifier Free Guidance: Controls how strictly the AI adheres to your prompt. 7.0-8.0 is best; higher values distort colors.">
                    <label for="cfg_scale">CFG Scale (<span id="cfg-val">7.0</span>)</label>
                    <input type="range" id="cfg_scale" min="1" max="15" step="0.5" value="7.0">
                </div>
            </div>

            <div class="input-group" title="Aspect ratio: Native standard resolutions for SDXL. Vertical aspect ratios drastically improve anatomy/poses.">
                <label for="resolution">Resolution</label>
                <select id="resolution">
                    <optgroup label="Portrait (Vertical)">
                        <option value="832x1216" selected>832 x 1216 (2:3)</option>
                        <option value="896x1152">896 x 1152 (3:4)</option>
                        <option value="768x1344">768 x 1344 (9:16)</option>
                        <option value="640x1536">640 x 1536 (1:2)</option>
                    </optgroup>

                    <optgroup label="Square">
                        <option value="1024x1024">1024 x 1024 (1:1)</option>
                    </optgroup>

                    <optgroup label="Landscape (Horizontal)">
                        <option value="1216x832">1216 x 832 (3:2)</option>
                        <option value="1152x896">1152 x 896 (4:3)</option>
                        <option value="1344x768">1344 x 768 (16:9)</option>
                        <option value="1536x640">1536 x 640 (2:1)</option>
                    </optgroup>
                </select>
            </div>

            <div class="input-group" title="Batch count: Number of alternative image variations to generate for this request.">
                <label for="num_outputs">Number of Images</label>
                <input type="number" id="num_outputs" min="1" max="100" value="2">
            </div>

            <button id="generate-btn" class="primary-btn" title="Send configuration parameters to the local pipeline server and start rendering">Generate</button>
        </aside>

        <!-- Right Panel: Preview -->
        <main class="preview-panel">
            <button id="menu-toggle" class="hamburger-btn">☰</button>
            <div class="progress-container" id="progress-container" style="display: none;">
                <div class="progress-bar-wrapper">
                    <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div >
                </div >
                <div class="status-text" id="status-text" aria-live="polite">Preparing...</div >
            </div >

            <div class="image-display">
                <div id="placeholder" class="placeholder">
                    <span>Your masterpiece will appear here</span>
                </div>
                <div id="image-wrapper" style="display: none; position: relative;">
                    <button id="prev-btn" class="nav-btn" aria-label="Previous Image">&lt;</button>
                    <img id="result-image" src="" alt="Generated Image">
                    <button id="next-btn" class="nav-btn" aria-label="Next Image">&gt;</button>
                </div>
            </div>

            <div id="action-area" style="display: none;">
                <button id="save-btn" class="secondary-btn">💾 Сохранить на диск</button>
            </div >
        </main>
    </div >
    <div id="overlay" class="overlay"></div>
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
